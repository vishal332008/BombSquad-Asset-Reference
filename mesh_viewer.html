<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mesh Viewer</title>
  <link rel="icon" type="image/png" href="BombSquadIcon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080c10;
      --border: #1a2030;
      --text: #d0d8e8;
      --accent: #00b4ff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,180,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,180,255,0.025) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
      z-index: 0;
    }

    #info {
      position: fixed;
      bottom: 10px;
      left: 15px;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      letter-spacing: 0.1em;
      opacity: .5;
      z-index: 10;
      pointer-events: none;
    }

    #backBtn {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 20;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--accent);
      text-decoration: none;
      border: 1px solid #00b4ff44;
      background: #00b4ff10;
      padding: 0.4rem 0.8rem;
      transition: all 0.15s ease;
      backdrop-filter: blur(4px);
    }
    #backBtn:hover {
      background: #00b4ff25;
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    #meshLabel {
      position: fixed;
      top: 15px;
      right: 15px;
      max-width: 45%;
      z-index: 20;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--accent);
      background: rgba(0, 180, 255, 0.08);
      border: 1px solid #00b4ff33;
      padding: 0.4rem 0.7rem;
      backdrop-filter: blur(4px);
      text-align: right;
      pointer-events: none;
      line-height: 1.4;
      word-break: break-word;
    }

    #texFloatLabel {
      position: fixed;
      z-index: 25;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #ff9900;
      background: rgba(8, 12, 16, 0.7);
      border: 1px solid #ff990055;
      padding: 0.3rem 0.7rem;
      backdrop-filter: blur(4px);
      pointer-events: none;
      transform: translate(-50%, -100%);
      white-space: nowrap;
      display: none;
    }

    #ui-panel {
      position: fixed;
      top: 65px;
      left: 15px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-start;
    }

    .menu-toggle {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      padding: 0.4rem 0.6rem;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
      text-transform: uppercase;
      width: auto;
      text-align: left;
    }

    #settingsToggle {
      color: var(--accent);
      background: rgba(0, 180, 255, 0.1);
      border: 1px solid rgba(0, 180, 255, 0.4);
    }
    #settingsToggle:hover { background: rgba(0, 180, 255, 0.2); border-color: var(--accent); }
    #settingsToggle.active { background: var(--accent); color: #000; box-shadow: 0 0 10px rgba(0,180,255,0.4); }

    #textureToggle {
      color: #ff9900;
      background: rgba(255, 153, 0, 0.1);
      border: 1px solid rgba(255, 153, 0, 0.4);
    }
    #textureToggle:hover { background: rgba(255, 153, 0, 0.2); border-color: #ff9900; }
    #textureToggle.active { background: #ff9900; color: #000; box-shadow: 0 0 10px rgba(255,153,0,0.4); }

    .dropdown-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(8, 12, 16, 0.75);
      padding: 10px;
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
      width: 180px;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      padding-top: 0;
      padding-bottom: 0;
      border-width: 0px;
      transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.25s ease, padding 0.3s ease, border-width 0.3s ease;
    }

    .dropdown-panel.open {
      max-height: 350px;
      opacity: 1;
      padding: 10px;
      border-width: 1px;
    }

    .dropdown-panel button, #texSearch {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      transition: all 0.15s ease;
      width: 100%;
      text-align: left;
      box-sizing: border-box;
      outline: none;
    }

    #wireBtn { color: #00ffcc; border: 1px solid #00ffcc44; background: #00ffcc10; }
    #wireBtn:hover { background: #00ffcc22; border-color: #00ffcc; transform: translateX(2px); }
    #wireBtn.active { background: #00ffcc; color: #000; border-color: #00ffcc; box-shadow: 0 0 10px rgba(0,255,204,0.4); }

    #flatBtn { color: #ccff00; border: 1px solid #ccff0044; background: #ccff0010; }
    #flatBtn:hover { background: #ccff0022; border-color: #ccff00; transform: translateX(2px); }
    #flatBtn.active { background: #ccff00; color: #000; border-color: #ccff00; box-shadow: 0 0 10px rgba(204,255,0,0.4); }

    #lightBtn { color: #ffbb00; border: 1px solid #ffbb0044; background: #ffbb0010; }
    #lightBtn:hover { background: #ffbb0022; border-color: #ffbb00; transform: translateX(2px); }
    #lightBtn.active { background: #ffbb00; color: #000; border-color: #ffbb00; box-shadow: 0 0 10px rgba(255,187,0,0.4); }

    #shadowBtn { color: #aa88ff; border: 1px solid #aa88ff44; background: #aa88ff10; }
    #shadowBtn:hover { background: #aa88ff22; border-color: #aa88ff; transform: translateX(2px); }
    #shadowBtn.active { background: #aa88ff; color: #000; border-color: #aa88ff; box-shadow: 0 0 10px rgba(170,136,255,0.4); }

    #gridBtn { color: #44ff88; border: 1px solid #44ff8844; background: #44ff8810; }
    #gridBtn:hover { background: #44ff8822; border-color: #44ff88; transform: translateX(2px); }
    #gridBtn.active { background: #44ff88; color: #000; border-color: #44ff88; box-shadow: 0 0 10px rgba(68,255,136,0.4); }

    #resetBtn { color: #ff3355; border: 1px solid #ff335544; background: #ff335510; margin-top: 5px; }
    #resetBtn:hover { background: #ff335522; border-color: #ff3355; transform: translateX(2px); }
    #resetBtn:active { background: #ff3355; color: #000; transform: translateX(0); }

    #texSearch {
      background: #ff990010;
      color: #ff9900;
      border: 1px solid #ff990044;
    }
    #texSearch:focus { border-color: #ff9900; }

    #texUploadBtn {
      color: #ff9900;
      border: 1px solid #ff990044;
      background: #ff990010;
    }
    #texUploadBtn:hover { background: #ff990022; border-color: #ff9900; transform: translateX(2px); }

    #removeTexBtn {
      color: #ff3355;
      border: 1px solid #ff335544;
      background: #ff335510;
      display: none;
    }
    #removeTexBtn:hover { background: #ff335522; border-color: #ff3355; transform: translateX(2px); }

    #texResults {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 140px;
      overflow-y: auto;
    }
    #texResults .tex-item {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.75rem;
      padding: 0.3rem 0.5rem;
      cursor: pointer;
      color: var(--text);
      border: 1px solid transparent;
    }
    #texResults .tex-item:hover {
      background: #ff990022;
      border-color: #ff990044;
    }
    #texResults .tex-item.active {
      background: #ff9900;
      color: #000;
    }

    #status {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      color: var(--accent);
      letter-spacing: 0.1em;
      z-index: 10;
      background: rgba(8, 12, 16, 0.85);
      border: 1px solid var(--border);
      padding: 20px;
      backdrop-filter: blur(8px);
    }
    #progress-container {
      width: 100%;
      height: 4px;
      background: var(--border);
      margin-top: 12px;
      border-radius: 2px;
      overflow: hidden;
    }
    #progress-bar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      transition: width 0.1s linear;
    }

    canvas { display: block; position: relative; z-index: 5; }
  </style>
</head>
<body>

  <a href="meshes.html" id="backBtn">← BACK</a>
  <div id="meshLabel"></div>
  <div id="texFloatLabel"></div>

  <div id="info">
    DRAG = ROTATE • SCROLL = ZOOM • RIGHT CLICK = PAN
  </div>

  <div id="ui-panel" style="display: none;">
    <button id="settingsToggle" class="menu-toggle">⚙️ SETTINGS</button>
    <div id="settings" class="dropdown-panel">
      <button id="wireBtn">Wireframe</button>
      <button id="flatBtn">Flat Shading</button>
      <button id="lightBtn">Sharp Light</button>
      <button id="shadowBtn">Shadows</button>
      <button id="gridBtn" class="active">Grid</button>
      <button id="resetBtn">Reset View</button>
    </div>

    <button id="textureToggle" class="menu-toggle">🎨 TEXTURE</button>
    <div id="texturePanel" class="dropdown-panel">
      <input type="text" id="texSearch" placeholder="Search..." autocomplete="off">
      <div id="texResults"></div>
      <button id="texUploadBtn">Upload</button>
      <input type="file" id="texUpload" accept=".png,image/png" style="display:none">
      <button id="removeTexBtn">Remove Texture</button>
    </div>
  </div>

  <div id="status">
    <div id="progress-text">INITIALIZING...</div>
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>
  </div>

  <script type="module">
    if (window.location.pathname.endsWith('.html')) {
      window.history.replaceState({}, document.title, window.location.pathname.replace('.html', '') + (window.location.search || ''));
    }

    import * as THREE from "https://esm.sh/three@0.158.0";
    import { OrbitControls } from "https://esm.sh/three@0.158.0/examples/jsm/controls/OrbitControls.js";
    import { OBJLoader } from "https://esm.sh/three@0.158.0/examples/jsm/loaders/OBJLoader.js";

    const params = new URLSearchParams(window.location.search);
    const modelName = params.get("model");
    const texName = params.get("tex");

    if (!modelName) {
      document.getElementById("progress-text").innerHTML = "<span style='color:#ff3355'>NO MODEL SPECIFIED</span><br><span style='font-size: 0.65rem; color: #8899aa; margin-top: 8px; display: block;'>Please select a mesh from the reference list.</span>";
      document.getElementById("progress-container").style.display = "none";
      throw new Error("Missing model");
    }

    document.getElementById("ui-panel").style.display = "flex";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080c10);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 10000);
    camera.position.set(0, 0, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true; 
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace; 
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    const ambient = new THREE.AmbientLight(0xffffff, 0.35);
    scene.add(ambient);

    const fillLight = new THREE.HemisphereLight(0xffffff, 0x222222, 0.5);
    scene.add(fillLight);

    const headLight = new THREE.DirectionalLight(0xffffff, 1.2);
    scene.add(headLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.bias = -0.0005; 
    scene.add(sunLight);

    function updateHeadLight() {
      headLight.position.copy(camera.position);
      headLight.target.position.copy(controls.target);
      scene.add(headLight.target);
    }

    let meshes = [];
    let wireframeEnabled = false;
    let flatEnabled = false;
    let sharpLight = false;
    let shadowsEnabled = false;
    let gridEnabled = true; 
    
    let shadowPlaneRef = null;
    let gridHelperRef = null;
    let initialCameraPos = new THREE.Vector3();
    let initialTarget = new THREE.Vector3();

    const meshLabel = document.getElementById("meshLabel");
    const texFloatLabel = document.getElementById("texFloatLabel");
    const removeTexBtn = document.getElementById("removeTexBtn");
    let currentTexLabelText = null;
    let meshTopWorldPos = null;

    meshLabel.textContent = modelName.replace(/\.obj$/i, "");

    function updateLabel(textureName) {
      currentTexLabelText = textureName;
      if (!textureName) {
        texFloatLabel.style.display = "none";
        removeTexBtn.style.display = "none";
      } else {
        texFloatLabel.textContent = textureName;
        texFloatLabel.style.display = "block";
        removeTexBtn.style.display = "block";
      }
    }

    function updateFloatLabelPosition() {
      if (!currentTexLabelText || !meshTopWorldPos) return;
      const vector = meshTopWorldPos.clone();
      vector.project(camera);
      texFloatLabel.style.left = ((vector.x * 0.5 + 0.5) * window.innerWidth) + "px";
      texFloatLabel.style.top = ((-vector.y * 0.5 + 0.5) * window.innerHeight) + "px";
    }

    let textureNames = [];
    fetch('texture_files/textures.json')
      .then(res => res.json())
      .then(data => { textureNames = data; })
      .catch(err => console.error(err));

    const loader = new OBJLoader();

    loader.load(
      "mesh_files/" + modelName,
      (object) => {
        let meshFound = false;
        object.traverse(child => {
          if (child.isMesh) {
            meshFound = true;
            meshes.push(child);
            child.castShadow = true;
            child.receiveShadow = true;
            child.material = new THREE.MeshStandardMaterial({
              color: 0xd0d8e8,
              roughness: 0.45,
              metalness: 0,
              flatShading: false
            });
          }
        });

        if (!meshFound) throw new Error("No mesh found");

        scene.add(object);
        object.updateMatrixWorld(true);

        const box = new THREE.Box3().setFromObject(object);
        const center = box.getCenter(new THREE.Vector3());
        const sphere = box.getBoundingSphere(new THREE.Sphere());
        const radius = sphere.radius;
        meshTopWorldPos = new THREE.Vector3(center.x, box.max.y + radius * 0.2, center.z);

        sunLight.position.set(center.x + radius * 1.5, center.y + radius * 2, center.z + radius);
        sunLight.target.position.copy(center);
        scene.add(sunLight.target);

        sunLight.shadow.camera.near = 0.1;
        sunLight.shadow.camera.far = radius * 10;
        sunLight.shadow.camera.left = -radius * 1.5;
        sunLight.shadow.camera.right = radius * 1.5;
        sunLight.shadow.camera.top = radius * 1.5;
        sunLight.shadow.camera.bottom = -radius * 1.5;
        sunLight.shadow.camera.updateProjectionMatrix();

        const gridSize = radius * 10;
        const gridHelper = new THREE.GridHelper(gridSize, 50, 0x00b4ff, 0x1a2030);
        gridHelper.position.set(center.x, box.min.y, center.z);
        scene.add(gridHelper);
        gridHelperRef = gridHelper;

        const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(gridSize, gridSize), new THREE.ShadowMaterial({ opacity: 0.6 }));
        shadowPlane.rotation.x = -Math.PI / 2;
        shadowPlane.position.set(center.x, box.min.y - 0.01, center.z);
        shadowPlane.receiveShadow = true;
        shadowPlane.visible = false; 
        scene.add(shadowPlane);
        shadowPlaneRef = shadowPlane;

        controls.target.copy(center);
        let distance = (radius / Math.sin((camera.fov * Math.PI / 180) / 2)) * 1.35;
        camera.position.copy(center.clone().add(new THREE.Vector3(distance, distance * 0.8, distance)));
        camera.lookAt(center);

        controls.minDistance = radius * 0.5;
        controls.maxDistance = radius * 5;
        controls.update();

        initialCameraPos.copy(camera.position);
        initialTarget.copy(controls.target);

        document.getElementById("status").remove();

        if (texName) {
          applyTexture("texture_files/" + toFileName(texName), texName);
        }
      },
      (progress) => {
        if (progress.total) {
          const p = (progress.loaded / progress.total) * 100;
          document.getElementById("progress-text").innerText = "LOADING " + p.toFixed(0) + "%";
          document.getElementById("progress-bar").style.width = p + "%";
        }
      },
      (error) => {
        console.error(error);
        document.getElementById("progress-text").innerHTML = "<span style='color:#ff3355'>FAILED LOADING MODEL</span>";
      }
    );

    function toggleMenu(activeId, inactiveId) {
      const activePanel = document.getElementById(activeId);
      const activeBtn = document.getElementById(activeId.replace('Panel', 'Toggle'));
      const inactivePanel = document.getElementById(inactiveId);
      const inactiveBtn = document.getElementById(inactiveId.replace('Panel', 'Toggle'));

      inactivePanel.classList.remove('open');
      inactiveBtn.classList.remove('active');

      activePanel.classList.toggle('open');
      activeBtn.classList.toggle('active');
    }

    document.getElementById("settingsToggle").onclick = () => toggleMenu('settings', 'texturePanel');
    document.getElementById("textureToggle").onclick = () => toggleMenu('texturePanel', 'settings');

    document.getElementById("wireBtn").onclick = function() {
      wireframeEnabled = !wireframeEnabled;
      this.classList.toggle("active", wireframeEnabled);
      meshes.forEach(m => m.material.wireframe = wireframeEnabled);
    };

    document.getElementById("flatBtn").onclick = function() {
      flatEnabled = !flatEnabled;
      this.classList.toggle("active", flatEnabled);
      meshes.forEach(m => { m.material.flatShading = flatEnabled; m.material.needsUpdate = true; });
    };

    document.getElementById("lightBtn").onclick = function() {
      sharpLight = !sharpLight;
      this.classList.toggle("active", sharpLight);
      sunLight.intensity = sharpLight ? 2.5 : 1.5;
      headLight.intensity = sharpLight ? 1.8 : 1.2;
      ambient.intensity = sharpLight ? 0.15 : 0.35;
    };

    document.getElementById("shadowBtn").onclick = function() {
      shadowsEnabled = !shadowsEnabled;
      this.classList.toggle("active", shadowsEnabled);
      if (shadowPlaneRef) shadowPlaneRef.visible = shadowsEnabled;
    };

    document.getElementById("gridBtn").onclick = function() {
      gridEnabled = !gridEnabled;
      this.classList.toggle("active", gridEnabled);
      if (gridHelperRef) gridHelperRef.visible = gridEnabled;
    };

    document.getElementById("resetBtn").onclick = () => {
      camera.position.copy(initialCameraPos);
      controls.target.copy(initialTarget);
      controls.update();
    };

    const textureLoader = new THREE.TextureLoader();

    function toFileName(name) {
      if (name.startsWith("reflection")) {
        const dir = name.slice(-2);
        let base = name.replace(/_([+-][xyz])$/i, "").replace(/([a-z])([A-Z])/g, "$1_$2").toLowerCase();
        return base + ".cubemap/" + dir.replace("+", "p").replace("-", "n").toLowerCase() + ".png";
      }
      return name.replace(/([a-z0-9])([A-Z])/g, "$1_$2").toLowerCase() + ".png";
    }

    const texSearch = document.getElementById("texSearch");
    const texResults = document.getElementById("texResults");

    function renderResults(filter) {
      texResults.innerHTML = "";
      const q = filter.trim().toLowerCase();
      textureNames.filter(n => n.toLowerCase().includes(q)).slice(0, 40).forEach(name => {
        const item = document.createElement("div");
        item.className = "tex-item";
        item.textContent = name;
        item.onclick = () => {
          applyTexture("texture_files/" + toFileName(name), name);
          document.querySelectorAll("#texResults .tex-item").forEach(el => el.classList.remove("active"));
          item.classList.add("active");
          document.getElementById("texturePanel").classList.remove("open");
          document.getElementById("textureToggle").classList.remove("active");
        };
        texResults.appendChild(item);
      });
    }

    texSearch.addEventListener("focus", () => renderResults(texSearch.value));
    texSearch.addEventListener("input", () => renderResults(texSearch.value));

    function applyTexture(url, label) {
      textureLoader.load(url, (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
        meshes.forEach(m => {
          m.material.map = tex;
          m.material.color.set(0xffffff);
          m.material.needsUpdate = true;
        });
        updateLabel(label);
      });
    }

    function removeTexture() {
      meshes.forEach(m => {
        m.material.map = null;
        m.material.color.set(0xd0d8e8);
        m.material.needsUpdate = true;
      });
      updateLabel(null);
      document.querySelectorAll("#texResults .tex-item").forEach(el => el.classList.remove("active"));
      document.getElementById("texturePanel").classList.remove("open");
      document.getElementById("textureToggle").classList.remove("active");
    }

    document.getElementById("removeTexBtn").onclick = removeTexture;

    document.getElementById("texUploadBtn").onclick = () => document.getElementById("texUpload").click();
    document.getElementById("texUpload").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      applyTexture(URL.createObjectURL(file), "custom");
      document.getElementById("texturePanel").classList.remove("open");
      document.getElementById("textureToggle").classList.remove("active");
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      updateHeadLight();
      updateFloatLabelPosition();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
