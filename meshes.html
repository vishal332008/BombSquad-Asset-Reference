<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BombSquad Mesh Reference</title>
<link rel="icon" type="image/png" href="BombSquadIcon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://vishal332008.github.io/BombSquad-Asset-Reference/meshes">
<meta property="og:title" content="BombSquad Asset Reference - Meshes">
<meta property="og:description" content="View and interact with all meshes for BombSquad 1.8.0.">
<meta property="og:image" content="https://raw.githubusercontent.com/vishal332008/BombSquad-Asset-Reference/refs/heads/main/BombSquadIcon.png">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c10;
    --panel: #0d1117;
    --border: #1a2030;
    --text: #d0d8e8;
    --muted: #445566;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,180,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,180,255,0.025) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 10;
    padding: 3.5rem 2rem 1.8rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(0,180,255,0.07) 0%, transparent 100%);
  }
  .home-link {
    position: absolute;
    top: 1.2rem;
    left: 2rem;
    z-index: 20;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: #00b4ff;
    text-decoration: none;
    border: 1px solid #00b4ff44;
    background: #00b4ff10;
    padding: 0.4rem 0.8rem;
    transition: all 0.15s ease;
  }

  .home-link:hover {
    background: #00b4ff25;
    border-color: #00b4ff;
    transform: translateY(-2px);
  }

  header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.6rem, 5vw, 3rem);
    font-weight: 900;
    letter-spacing: 0.08em;
    background: linear-gradient(90deg, #00b4ff, #00ffcc, #00b4ff);
    background-size: 200%;
    animation: shimmer 4s linear infinite;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-transform: uppercase;
  }
  @keyframes shimmer { 0%{background-position:0%} 100%{background-position:200%} }
  header p { margin-top: 0.4rem; color: var(--muted); font-size: 0.8rem; letter-spacing: 0.2em; }

  .stats {
    display: flex;
    justify-content: center;
    gap: 2.5rem;
    margin-top: 1.2rem;
    flex-wrap: wrap;
  }
  .stat-num { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 700; color: #00ffcc; }
  .stat-label { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; }

  .search-wrap {
    position: sticky; top: 0; z-index: 100;
    background: rgba(8,12,16,0.96);
    backdrop-filter: blur(12px);
    padding: 0.9rem 2rem;
    border-bottom: 1px solid var(--border);
  }
  .search-container { position: relative; max-width: 560px; margin: 0 auto; }
  .search-icon { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search-wrap input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 0.55rem 1rem 0.55rem 2.2rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-wrap input:focus {
    border-color: #00b4ff;
    box-shadow: 0 0 14px rgba(0,180,255,0.15);
  }

  main {
    position: relative; z-index: 1;
    padding: 2rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  .section {
    margin-bottom: 2rem;
    animation: fadeUp 0.35s ease both;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

  .section-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.6rem;
  }
  .section-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 0.25rem 0.7rem;
    border-left: 3px solid;
    white-space: nowrap;
  }
  .section-count { font-size: 0.68rem; color: var(--muted); letter-spacing: 0.08em; white-space: nowrap; }
  .section-line { flex: 1; height: 1px; background: var(--border); }

  .tags { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .tag {
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.28rem 0.6rem;
    border: 1px solid;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
    position: relative;
  }
  .tag:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
  .tag.hidden { display: none; }

  .no-results { display: none; text-align: center; padding: 3rem; color: var(--muted); font-size: 0.85rem; letter-spacing: 0.1em; font-family: 'Orbitron', sans-serif; }

  footer {
    position: relative; z-index: 1;
    text-align: center; padding: 1.5rem;
    color: var(--muted); font-size: 0.68rem;
    letter-spacing: 0.15em; border-top: 1px solid var(--border);
  }

  /* ── Section color themes ── */
  [data-section="char-head"] .section-title   { color:#ff6b35; border-color:#ff6b35; }
  [data-section="char-head"] .tag             { color:#ff6b35; border-color:#ff6b3544; background:#ff6b3510; }
  [data-section="char-head"] .tag:hover       { background:#ff6b3522; border-color:#ff6b35; }

  [data-section="char-torso"] .section-title  { color:#ff9500; border-color:#ff9500; }
  [data-section="char-torso"] .tag            { color:#ff9500; border-color:#ff950044; background:#ff950010; }
  [data-section="char-torso"] .tag:hover      { background:#ff950022; border-color:#ff9500; }

  [data-section="char-pelvis"] .section-title { color:#ffbb00; border-color:#ffbb00; }
  [data-section="char-pelvis"] .tag           { color:#ffbb00; border-color:#ffbb0044; background:#ffbb0010; }
  [data-section="char-pelvis"] .tag:hover     { background:#ffbb0022; border-color:#ffbb00; }

  [data-section="char-arm"] .section-title    { color:#ffe000; border-color:#ffe000; }
  [data-section="char-arm"] .tag              { color:#ffe000; border-color:#ffe00044; background:#ffe00010; }
  [data-section="char-arm"] .tag:hover        { background:#ffe00022; border-color:#ffe000; }

  [data-section="char-hand"] .section-title   { color:#ccff00; border-color:#ccff00; }
  [data-section="char-hand"] .tag             { color:#ccff00; border-color:#ccff0044; background:#ccff0010; }
  [data-section="char-hand"] .tag:hover       { background:#ccff0022; border-color:#ccff00; }

  [data-section="char-leg"] .section-title    { color:#44ff88; border-color:#44ff88; }
  [data-section="char-leg"] .tag              { color:#44ff88; border-color:#44ff8844; background:#44ff8810; }
  [data-section="char-leg"] .tag:hover        { background:#44ff8822; border-color:#44ff88; }

  [data-section="char-toes"] .section-title   { color:#00ffcc; border-color:#00ffcc; }
  [data-section="char-toes"] .tag             { color:#00ffcc; border-color:#00ffcc44; background:#00ffcc10; }
  [data-section="char-toes"] .tag:hover       { background:#00ffcc22; border-color:#00ffcc; }

  [data-section="char-eye"] .section-title    { color:#00eeff; border-color:#00eeff; }
  [data-section="char-eye"] .tag              { color:#00eeff; border-color:#00eeff44; background:#00eeff10; }
  [data-section="char-eye"] .tag:hover        { background:#00eeff22; border-color:#00eeff; }

  [data-section="char-hair"] .section-title   { color:#00b4ff; border-color:#00b4ff; }
  [data-section="char-hair"] .tag             { color:#00b4ff; border-color:#00b4ff44; background:#00b4ff10; }
  [data-section="char-hair"] .tag:hover       { background:#00b4ff22; border-color:#00b4ff; }

  [data-section="weapons"] .section-title     { color:#ff3355; border-color:#ff3355; }
  [data-section="weapons"] .tag               { color:#ff3355; border-color:#ff335544; background:#ff335510; }
  [data-section="weapons"] .tag:hover         { background:#ff335522; border-color:#ff3355; }

  [data-section="levels"] .section-title      { color:#88ff44; border-color:#88ff44; }
  [data-section="levels"] .tag                { color:#88ff44; border-color:#88ff4444; background:#88ff4410; }
  [data-section="levels"] .tag:hover          { background:#88ff4422; border-color:#88ff44; }

  [data-section="collide"] .section-title     { color:#55cc44; border-color:#55cc44; }
  [data-section="collide"] .tag               { color:#55cc44; border-color:#55cc4444; background:#55cc4410; }
  [data-section="collide"] .tag:hover         { background:#55cc4422; border-color:#55cc44; }

  [data-section="levelparts"] .section-title  { color:#44aaff; border-color:#44aaff; }
  [data-section="levelparts"] .tag            { color:#44aaff; border-color:#44aaff44; background:#44aaff10; }
  [data-section="levelparts"] .tag:hover      { background:#44aaff22; border-color:#44aaff; }

  [data-section="ui-btn"] .section-title      { color:#aa88ff; border-color:#aa88ff; }
  [data-section="ui-btn"] .tag                { color:#aa88ff; border-color:#aa88ff44; background:#aa88ff10; }
  [data-section="ui-btn"] .tag:hover          { background:#aa88ff22; border-color:#aa88ff; }

  [data-section="ui-misc"] .section-title     { color:#cc88ff; border-color:#cc88ff; }
  [data-section="ui-misc"] .tag               { color:#cc88ff; border-color:#cc88ff44; background:#cc88ff10; }
  [data-section="ui-misc"] .tag:hover         { background:#cc88ff22; border-color:#cc88ff; }

  [data-section="effects"] .section-title     { color:#ff88cc; border-color:#ff88cc; }
  [data-section="effects"] .tag               { color:#ff88cc; border-color:#ff88cc44; background:#ff88cc10; }
  [data-section="effects"] .tag:hover         { background:#ff88cc22; border-color:#ff88cc; }

  [data-section="images"] .section-title      { color:#ffaaaa; border-color:#ffaaaa; }
  [data-section="images"] .tag                { color:#ffaaaa; border-color:#ffaaaa44; background:#ffaaaa10; }
  [data-section="images"] .tag:hover          { background:#ffaaaa22; border-color:#ffaaaa; }

  [data-section="misc"] .section-title        { color:#aaaaaa; border-color:#aaaaaa; }
  [data-section="misc"] .tag                  { color:#aaaaaa; border-color:#aaaaaa33; background:#aaaaaa08; }
  [data-section="misc"] .tag:hover            { background:#aaaaaa18; border-color:#aaaaaa; }

  /* Fallback color style for any extra category keys */
  .section-title { color: #00b4ff; border-color: #00b4ff; }
  .tag { color: #00b4ff; border-color: #00b4ff44; background: #00b4ff10; }
  .tag:hover { background: #00b4ff25; border-color: #00b4ff; }
</style>
</head>
<body>

<header>
  <a href="." class="home-link">← HOME</a>
  <h1>BombSquad Meshes</h1>
  <p>CLICK ANY TAG TO VIEW THE MESH - BOMBSQUAD 1.8.0</p>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="totalCount">0</div><div class="stat-label">Total Meshes</div></div>
    <div class="stat"><div class="stat-num" id="catCount">0</div><div class="stat-label">Categories</div></div>
    <div class="stat"><div class="stat-num" id="visibleCount">0</div><div class="stat-label">Showing</div></div>
  </div>
</header>

<div class="search-wrap">
  <div class="search-container">
    <span class="search-icon">⌕</span>
    <input type="text" id="search" placeholder="Search meshes..." autocomplete="off" spellcheck="false">
  </div>
</div>

<main id="main">
  <div class="no-results" id="noResults">NO MESHES FOUND</div>
</main>

<footer>
  <div style="text-align: center; margin-top: 0.4rem; color: var(--accent2);">MADE BY: @vishyyy338 & @chrosticey</div>
</footer>

<script>
  if (window.location.pathname.endsWith('.html')) {
    window.history.replaceState({}, document.title, window.location.pathname.replace('.html', '') + (window.location.search || ''));
  }

  async function initMeshReference() {
    let categories = [];
    try {
      const res = await fetch('mesh_files/meshes.json');
      categories = await res.json();
    } catch (e) {
      console.error("Could not fetch meshes.json", e);
      return;
    }

    const mainContainer = document.getElementById('main');
    const noResultsEl = document.getElementById('noResults');
    
    // Filter out categories that have no items (empty arrays)
    const activeCategories = categories.filter(cat => cat.items && cat.items.length > 0);
    
    document.getElementById('catCount').textContent = activeCategories.length;

    let totalItemsCount = 0;

    activeCategories.forEach(cat => {
      totalItemsCount += cat.items.length;

      const sectionDiv = document.createElement('div');
      sectionDiv.className = 'section';
      sectionDiv.setAttribute('data-section', cat.key);

      const headerDiv = document.createElement('div');
      headerDiv.className = 'section-header';
      headerDiv.innerHTML = `
        <div class="section-title">${cat.title}</div>
        <div class="section-count">${cat.items.length} meshes</div>
        <div class="section-line"></div>
      `;
      sectionDiv.appendChild(headerDiv);

      const tagsDiv = document.createElement('div');
      tagsDiv.className = 'tags';

      cat.items.forEach(name => {
        const tagSpan = document.createElement('span');
        tagSpan.className = 'tag';
        tagSpan.textContent = name;
        tagsDiv.appendChild(tagSpan);
      });

      sectionDiv.appendChild(tagsDiv);
      mainContainer.insertBefore(sectionDiv, noResultsEl);
    });

    document.getElementById('totalCount').textContent = totalItemsCount;
    document.getElementById('visibleCount').textContent = totalItemsCount;

    const allTags = document.querySelectorAll('.tag');

    function toSnakeCase(str) {
      return str.replace(/([a-z])([A-Z])/g, '$1_$2').toLowerCase();
    }

    allTags.forEach(tag => {
      tag.addEventListener('click', () => {
        const rawName = tag.textContent.trim();
        const fileName = toSnakeCase(rawName) + '.obj';
        window.location.href = 'mesh_viewer.html?model=' + encodeURIComponent(fileName);
      });
    });

    const search = document.getElementById('search');
    const sections = document.querySelectorAll('.section');

    search.addEventListener('input', () => {
      const q = search.value.trim().toLowerCase();
      let visible = 0;
      sections.forEach(sec => {
        const tags = sec.querySelectorAll('.tag');
        let sv = 0;
        tags.forEach(t => {
          const m = !q || t.textContent.toLowerCase().includes(q);
          t.classList.toggle('hidden', !m);
          if (m) { sv++; visible++; }
        });
        sec.style.display = sv === 0 ? 'none' : '';
        sec.querySelector('.section-count').textContent = (q ? sv + ' / ' + tags.length : tags.length) + ' meshes';
      });
      document.getElementById('visibleCount').textContent = visible;
      noResultsEl.style.display = visible === 0 ? 'block' : 'none';
    });
  }

  initMeshReference();
</script>
</body>
</html>
